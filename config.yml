default:
  project_name: "aim-2025-sandbox"
  
  # AI Support Configuration
  ai_support:
    personas_dir: "./ai/personas/"
    memory_dir: "./ai/memory/"
    project_dir: "./ai/project/"
    default_persona: "default"
    context_components:
      - "mission"
      - "method"
      - "glossary"
    memory_enabled: true
  
  # Database Configuration - Access to prepared data from books-of-ukraine
  # Available databases:
  # - main: Final analytical database (optimized for analysts)
  # - stage_2: Comprehensive database with custom additions
  database:
    books_of_ukraine:
      main: "./data-public/derived/manipulation/SQLite/books-of-ukraine.sqlite"
      stage_2: "./data-public/derived/manipulation/SQLite/books-of-ukraine-2.sqlite"

  # Basic project configuration
  directories:
    ai: "./ai/"
    data_private: "./data-private/"
    data_public: "./data-public/"
    analysis: "./analysis/"
    derived: "./data-private/derived/"
    raw: "./data-private/raw/"
